
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>快乐贪吃蛇</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:16px 12px 28px;
  font-family:system-ui,-apple-system,sans-serif;
  text-align:center;color:#173b2a;
  background:linear-gradient(160deg,#e8ffe9,#d7f3ff);
}
h1{margin:4px 0 10px;font-size:28px}
.info{
  display:flex;justify-content:center;gap:18px;
  flex-wrap:wrap;font-size:17px;font-weight:700;margin:10px 0;
}
#game{
  width:min(94vw,480px);height:min(94vw,480px);
  display:block;margin:12px auto;border:4px solid #367b53;
  border-radius:16px;background:#f8fff1;
  box-shadow:0 5px 16px #245c3425;touch-action:none;
}
button{
  border:0;border-radius:12px;padding:12px 18px;
  margin:5px;font-size:16px;font-weight:700;
  background:#2f9e62;color:white;cursor:pointer;
  touch-action:manipulation;
}
button:active{transform:scale(.97)}
button:disabled{opacity:.45}
.secondary{background:#607d8b}
.danger{background:#d9534f}
.controls{max-width:380px;margin:10px auto}
#dpad{
  display:grid;grid-template-columns:repeat(3,70px);
  grid-template-rows:repeat(2,58px);justify-content:center;gap:5px;
}
#dpad button{margin:0;padding:8px;font-size:23px}
#up{grid-column:2;grid-row:1}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#stickArea{
  width:190px;height:190px;margin:12px auto;
  border-radius:50%;background:#cdebd6;
  border:3px solid #8fc9a3;position:relative;
  touch-action:none;display:none;
}
#stick{
  position:absolute;width:68px;height:68px;border-radius:50%;
  background:#2f9e62;border:4px solid #fff;
  box-shadow:0 2px 8px #0002;left:58px;top:58px;
  pointer-events:none;
}
.panel{
  max-width:440px;margin:12px auto;padding:18px;
  background:#ffffffed;border-radius:18px;
  box-shadow:0 4px 16px #00000012;
}
#overlay{display:none}
#overlay h2{margin:0 0 8px}
#countdown{font-size:22px;font-weight:800;color:#d9534f}
#message{min-height:24px;color:#41654e}
.small{font-size:13px;color:#557363}
</style>
</head>
<body>
<h1>🐍 快乐贪吃蛇</h1>

<div class="info">
  <span>🍎 得分：<span id="score">0</span></span>
  <span>💚 剩余复活：<span id="lives">3</span></span>
</div>

<canvas id="game" width="480" height="480"></canvas>

<div class="panel" id="overlay">
  <h2 id="overlayTitle">🐍 你撞到了！</h2>
  <p id="overlayText">要不要再试一次？</p>
  <p id="countdown"></p>
  <div id="reviveActions">
    <button id="reviveBtn">💚 复活</button>
    <button id="exitBtn" class="danger">退出游戏</button>
  </div>
  <div id="endActions" style="display:none">
    <button id="restartBtn">🔄 重新开始</button>
    <button id="endExitBtn" class="danger">退出游戏</button>
  </div>
</div>

<div>
  <button id="startBtn">▶ 开始游戏</button>
  <button id="pauseBtn" class="secondary" disabled>⏸ 暂停</button>
  <button id="restartTopBtn" class="secondary">🔄 重开</button>
</div>

<div class="controls">
  <button id="modeBtn" class="secondary">切换为虚拟摇杆</button>
  <div id="dpad">
    <button id="up" aria-label="向上">⬆️</button>
    <button id="left" aria-label="向左">⬅️</button>
    <button id="down" aria-label="向下">⬇️</button>
    <button id="right" aria-label="向右">➡️</button>
  </div>
  <div id="stickArea"><div id="stick"></div></div>
</div>

<p id="message">点击“开始游戏”，用方向键控制小蛇。</p>
<p class="small">每吃一颗苹果加 1 分。游戏运行时可以随时暂停。</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const CELL = 24;
const CELLS = 20;

const $ = id => document.getElementById(id);
let snake, food, direction, nextDirection, score, lives;
let running = false, paused = false, started = false;
let gameTimer = null, countdownTimer = null;
let deadline = 0, mode = "buttons", stickPointer = null;

function updateInfo(){
  $("score").textContent = score;
  $("lives").textContent = lives;
}

function randomFood(){
  let p;
  do {
    p = {x:Math.floor(Math.random()*CELLS),
         y:Math.floor(Math.random()*CELLS)};
  } while(snake.some(s=>s.x===p.x && s.y===p.y));
  return p;
}

function resetSnake(){
  snake = [
    {x:9,y:10},{x:8,y:10},{x:7,y:10}
  ];
  direction = {x:1,y:0};
  nextDirection = {x:1,y:0};
  food = randomFood();
  draw();
}

function startGame(){
  clearInterval(gameTimer);
  clearInterval(countdownTimer);
  $("overlay").style.display = "none";
  started = true;
  running = true;
  paused = false;
  score = 0;
  lives = 3;
  resetSnake();
  updateInfo();
  $("startBtn").textContent = "▶ 游戏中";
  $("pauseBtn").disabled = false;
  $("pauseBtn").textContent = "⏸ 暂停";
  $("message").textContent = "加油！吃到一颗苹果得 1 分。";
  gameTimer = setInterval(tick,220);
}

function draw(){
  ctx.clearRect(0,0,480,480);

  // 草地网格
  for(let y=0;y<CELLS;y++){
    for(let x=0;x<CELLS;x++){
      ctx.fillStyle=(x+y)%2===0?"#f7ffef":"#eff9e6";
      ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
    }
  }

  // 苹果
  const fx=food.x*CELL+CELL/2, fy=food.y*CELL+CELL/2;
  ctx.fillStyle="#ef5350";
  ctx.beginPath();ctx.arc(fx,fy,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#6b4226";
  ctx.fillRect(fx-1,fy-13,3,6);
  ctx.fillStyle="#43a047";
  ctx.beginPath();ctx.ellipse(fx+5,fy-10,5,3,-.5,0,Math.PI*2);ctx.fill();

  // 蛇身渐变
  snake.slice().reverse().forEach((s,i)=>{
    const index=snake.length-1-i;
    const x=s.x*CELL,y=s.y*CELL;
    const r=ctx.createLinearGradient(x,y,x+CELL,y+CELL);
    r.addColorStop(0,index===0?"#6ee7a0":"#45c978");
    r.addColorStop(1,"#198b50");
    ctx.fillStyle=r;
    ctx.beginPath();
    ctx.roundRect(x+2,y+2,CELL-4,CELL-4,8);
    ctx.fill();
  });

  // 蛇头和眼睛
  const h=snake[0], hx=h.x*CELL, hy=h.y*CELL;
  ctx.fillStyle="#167b45";
  ctx.beginPath();ctx.roundRect(hx+1,hy+1,CELL-2,CELL-2,9);ctx.fill();
  let eyes;
  if(direction.x===1) eyes=[[hx+17,hy+7],[hx+17,hy+17]];
  else if(direction.x===-1) eyes=[[hx+7,hy+7],[hx+7,hy+17]];
  else if(direction.y===-1) eyes=[[hx+7,hy+7],[hx+17,hy+7]];
  else eyes=[[hx+7,hy+17],[hx+17,hy+17]];
  eyes.forEach(([x,y])=>{
    ctx.fillStyle="white";ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#173b2a";ctx.beginPath();ctx.arc(x+1,y,2,0,Math.PI*2);ctx.fill();
  });
}

function tick(){
  if(!running || paused) return;
  direction = nextDirection;
  const head={
    x:snake[0].x+direction.x,
    y:snake[0].y+direction.y
  };
  const hitWall=head.x<0||head.x>=CELLS||head.y<0||head.y>=CELLS;
  const hitBody=snake.some((s,i)=>
    i>0 && s.x===head.x && s.y===head.y
  );

  if(hitWall||hitBody){
    handleDeath();
    return;
  }

  snake.unshift(head);
  if(head.x===food.x && head.y===food.y){
    score++;
    food=randomFood();
    updateInfo();
  }else{
    snake.pop();
  }
  draw();
}

function handleDeath(){
  running=false;
  clearInterval(gameTimer);
  $("pauseBtn").disabled=true;
  $("overlay").style.display="block";
  $("reviveActions").style.display="none";
  $("endActions").style.display="none";

  if(lives>0){
    $("overlayTitle").textContent="💥 撞到了！";
    $("overlayText").textContent="你还可以复活，或直接退出游戏。";
    $("reviveActions").style.display="block";
    $("reviveBtn").disabled=false;
    deadline=Date.now()+15000;
    updateCountdown();
    clearInterval(countdownTimer);
    countdownTimer=setInterval(updateCountdown,200);
  }else{
    showGameOver("复活次数已经用完啦！");
  }
}

function updateCountdown(){
  const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));
  $("countdown").textContent="复活倒计时："+left+" 秒";
  if(left<=0){
    clearInterval(countdownTimer);
    $("reviveActions").style.display="none";
    showGameOver("复活时间已结束！");
  }
}

function revive(){
  if(Date.now()>=deadline || lives<=0) return;
  clearInterval(countdownTimer);
  lives--;
  resetSnake();
  updateInfo();
  $("overlay").style.display="none";
  $("message").textContent="复活成功！继续加油！";
  running=true;
  paused=false;
  $("pauseBtn").disabled=false;
  $("pauseBtn").textContent="⏸ 暂停";
  gameTimer=setInterval(tick,220);
}

function showGameOver(text){
  running=false;
  paused=false;
  clearInterval(gameTimer);
  clearInterval(countdownTimer);
  $("overlay").style.display="block";
  $("overlayTitle").textContent="游戏结束";
  $("overlayText").textContent=text+" 你的最终得分是："+score+" 分。";
  $("countdown").textContent="";
  $("reviveActions").style.display="none";
  $("endActions").style.display="block";
  $("pauseBtn").disabled=true;
  $("message").textContent="点击重新开始，再挑战一次吧！";
}

function exitGame(){
  clearInterval(gameTimer);
  clearInterval(countdownTimer);
  running=false;paused=false;started=false;
  $("overlay").style.display="none";
  $("pauseBtn").disabled=true;
  $("startBtn").textContent="▶ 开始游戏";
  $("message").textContent="游戏已退出。点击“开始游戏”可以再玩。";
  draw();
}

function togglePause(){
  if(!started || $("overlay").style.display==="block") return;
  if(!running && !paused) return;
  paused=!paused;
  if(paused){
    $("pauseBtn").textContent="▶ 继续";
    $("message").textContent="游戏已暂停，准备好后点击“继续”。";
  }else{
    $("pauseBtn").textContent="⏸ 暂停";
    $("message").textContent="继续游戏！";
  }
}

function setDirection(x,y){
  if(!started){
    startGame();
  }
  if(!running || paused || $("overlay").style.display==="block") return;
  if(x===-direction.x && y===-direction.y) return;
  nextDirection={x,y};
}

$("startBtn").addEventListener("click",()=>{
  if(!started || $("overlay").style.display!=="none") startGame();
});
$("pauseBtn").addEventListener("click",togglePause);
$("restartTopBtn").addEventListener("click",startGame);
$("reviveBtn").addEventListener("click",revive);
$("exitBtn").addEventListener("click",exitGame);
$("endExitBtn").addEventListener("click",exitGame);
$("restartBtn").addEventListener("click",startGame);

$("up").addEventListener("pointerdown",()=>setDirection(0,-1));
$("down").addEventListener("pointerdown",()=>setDirection(0,1));
$("left").addEventListener("pointerdown",()=>setDirection(-1,0));
$("right").addEventListener("pointerdown",()=>setDirection(1,0));

document.addEventListener("keydown",e=>{
  const keys={
    ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],
    ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]
  };
  if(keys[e.key]){
    e.preventDefault();
    setDirection(...keys[e.key]);
  }
  if(e.key===" "){
    e.preventDefault();
    togglePause();
  }
});

$("modeBtn").addEventListener("click",()=>{
  mode=mode==="buttons"?"stick":"buttons";
  $("dpad").style.display=mode==="buttons"?"grid":"none";
  $("stickArea").style.display=mode==="stick"?"block":"none";
  $("modeBtn").textContent=mode==="buttons"?
    "切换为虚拟摇杆":"切换为方向按钮";
});

const area=$("stickArea"), stick=$("stick");
function moveStick(e){
  const r=area.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  const dx=e.clientX-cx,dy=e.clientY-cy;
  const dist=Math.hypot(dx,dy),max=48;
  const scale=dist>max?max/dist:1;
  const sx=dx*scale,sy=dy*scale;
  stick.style.left=(r.width/2-34+sx)+"px";
  stick.style.top=(r.height/2-34+sy)+"px";
  if(dist>18){
    if(Math.abs(dx)>Math.abs(dy)) setDirection(dx>0?1:-1,0);
    else setDirection(0,dy>0?1:-1);
  }
}
area.addEventListener("pointerdown",e=>{
  stickPointer=e.pointerId;
  area.setPointerCapture(e.pointerId);
  moveStick(e);
});
area.addEventListener("pointermove",e=>{
  if(e.pointerId===stickPointer) moveStick(e);
});
function releaseStick(){
  stickPointer=null;
  stick.style.left="58px";stick.style.top="58px";
}
area.addEventListener("pointerup",releaseStick);
area.addEventListener("pointercancel",releaseStick);

// 初始画面
score=0;lives=3;
resetSnake();
updateInfo();
</script>
</body>
</html>
